routeA:
  target: "1"
  steps:
    - step_id: 1
      name: "Reduction of nitro group → amine"
      product_mw: 109.13
      reagents:
        - name: "p-Nitrophenol"
          mw: 139.11
          pkg_size: 100
          pkg_price: 5.0
          cost_per_g: 0.05
          moles: 1
          mass: 10.0
          mass_unit: "g"
          is_limiting: true
        - name: "Hydrogen"
          mw: 2.02
          pkg_size: 1000
          pkg_price: 10.0
          cost_per_g: 0.01
          moles: 3
          mass: 0.436
          mass_unit: "g"
          is_limiting: false
        - name: "Pd/C catalyst"
          mw: 106.42
          pkg_size: 10
          pkg_price: 150.0
          cost_per_g: 15.0
          moles: 0.05
          mass: 0.383
          mass_unit: "g"
          is_limiting: false
      molarity: 1.0
      solvent_volume: 0.072
      solvent_volume_unit: "L"
      solvent_volume_l: 0.072
      solvent_name: "Ethanol"
      solvent_density: 0.789
      solvent_bottle_l: 1.0
      solvent_bottle_price: 2.50
      solvent_price_per_l: 2.50
      yield_percent: 95
      temperature: "RT"
      time: "4h"
      procedure: "p-Nitrophenol + H₂ (Pd/C catalyst) → p-aminophenol + H₂O"
      depends_on: []
    - step_id: 2
      name: "N-acetylation → paracetamol"
      product_mw: 151.16
      reagents:
        - name: "p-Aminophenol"
          mw: 109.13
          pkg_size: 100
          pkg_price: 10.0
          cost_per_g: 0.10
          moles: 1
          mass: 10.0
          mass_unit: "g"
          is_limiting: true
        - name: "Acetic anhydride"
          mw: 102.09
          pkg_size: 100
          pkg_price: 3.0
          cost_per_g: 0.03
          moles: 1.1
          mass: 10.29
          mass_unit: "g"
          is_limiting: false
      molarity: 2.0
      solvent_volume: 45.8
      solvent_volume_unit: "mL"
      solvent_volume_l: 0.0458
      solvent_name: "Water"
      solvent_density: 1.0
      solvent_bottle_l: 1.0
      solvent_bottle_price: 0.01
      solvent_price_per_l: 0.01
      yield_percent: 90
      temperature: "80C"
      time: "2h"
      procedure: "p-Aminophenol + acetic anhydride → paracetamol + acetic acid"
      depends_on: [1]

